scenarios:
  - id: minimal
    name: "Vanilla cluster — no preinstalled addons"
    cluster: { provider: kind }
    mechanisms: [addon:none]
    tags: [pr-subset, nightly]
  - id: with-cert-manager
    name: "Customer ships cert-manager preinstalled"
    cluster:
      provider: kind
      preinstall:
        - { chart: jetstack/cert-manager, release: cert-manager, namespace: cert-manager }
    mechanisms: [addon:cert-manager]
    tags: [pr-subset, nightly]
  - id: subchart-postgres-internal
    name: "Internal postgres subchart enabled"
    cluster: { provider: kind }
    mechanisms: [subchart:postgres-internal]
    tags: [pr-subset, nightly]
