---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-managed-by-annotation
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: add-managed-by
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        patchesJson6902: |-
          - op: add
            path: /metadata/annotations/kyverno.io~1managed-by
            value: "chart-test-swarm"
