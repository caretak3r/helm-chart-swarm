# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, yamllint.
# Apply to your own GKE cluster per the gcp-pd-csi primer instructions.
---
id: storage-gcp-pd-csi-snapshot
name: "GCP PD CSI Snapshot"
description: >-
  GCE PD CSI Driver creates a Persistent Disk snapshot from a VolumeSnapshot
  resource and provisions a new PVC from the snapshot. Verifies that restored
  data matches the original volume.
labels:
  customer: any
  profile: gke
  chart-test-swarm/target-k8s-version: gke-1.30
cluster:
  provider: gke
  k8s_version: "1.30"
  preinstall:
    - kind: raw_manifest
      path: chart-test/fixtures/storage/gcp-pd-csi/storageclass-ssd.yaml
    - kind: raw_manifest
      path: chart-test/fixtures/storage/gcp-pd-csi/volumesnapshotclass.yaml
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    darkroom.enabled: "true"
    darkroom.persistence.enabled: "true"
    darkroom.persistence.storageClassName: "pd-ssd"
    darkroom.persistence.accessMode: "ReadWriteOnce"
    darkroom.persistence.size: "10Gi"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/storage/gcp-pd-csi/snapshot.sh
tags: [cloud-native, storage]
mechanisms: ['cloud:gke', 'addon:gcp-pd-csi', 'feature:volume-snapshot']
category: storage/csi
tier: authored-only
integration: gcp-pd-csi
