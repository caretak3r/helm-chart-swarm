id: test-config-version
name: "Test: config version fallback for preinstalls"
description: "Verifies that preinstall version is resolved from versions.yaml when not specified in scenario"
labels: {customer: test, profile: validation}
cluster:
  provider: kind
  k8s_version: v1.30.0
  preinstall:
    - kind: helm
      chart: jetstack/cert-manager
      release: cert-manager
      namespace: cert-manager
      repo:
        name: jetstack
        url: "https://charts.jetstack.io"
      values:
        crds:
          enabled: true
product:
  chart: ./chart
  release: sample
  namespace: sample
asserts:
  - {type: helm-status-deployed, release: sample, namespace: sample}
  - {type: pods-ready, namespace: sample, timeout: 3m}
tags: [validation-test]
