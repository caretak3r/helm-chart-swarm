[project]
name = "testgrid"
version = "0.1.0"
description = "Static HTML dashboard generator for chart-test-swarm scenario runs."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "check-jsonschema>=0.28.0",
]

[project.scripts]
testgrid = "testgrid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testgrid"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

# jinja2-stubs is not available on PyPI; ignore missing imports for jinja2
# specifically rather than disabling strict mode wholesale.
[[tool.mypy.overrides]]
module = "jinja2"
ignore_missing_imports = true
