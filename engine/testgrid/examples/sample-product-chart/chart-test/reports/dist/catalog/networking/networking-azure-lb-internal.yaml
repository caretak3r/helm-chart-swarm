# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, kubeval, yamllint.
# Apply to your own AKS cluster per the azure-lb primer instructions.
---
id: networking-azure-lb-internal
name: "Azure LB Internal"
description: >-
  AKS provisions an internal Azure Load Balancer (ILB) from a Service of type
  LoadBalancer with the internal annotation; smoke-script verifies the ILB IP
  is a private VNet address and curls from within the VNet.
labels:
  customer: any
  profile: aks
  chart-test-swarm/target-k8s-version: aks-1.30
cluster:
  provider: aks
  k8s_version: "1.30"
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    service.type: "LoadBalancer"
    service.annotations.service.beta.kubernetes.io/azure-load-balancer-internal: "true"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/cloud-native/aks/internal-lb.sh
tags: [cloud-native]
mechanisms: ['cloud:aks', 'addon:azure-lb', 'addon:internal-lb']
category: networking/ingress-lb
tier: authored-only
integration: azure-lb
