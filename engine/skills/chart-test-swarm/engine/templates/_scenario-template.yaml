# Template for a new scenario. Copy into chart-test/scenarios/ and fill in.
# See ../../docs/scenario-authoring.md for the full schema reference.

id: <kebab-case-id>
name: "<short human title>"
description: "<one paragraph: what customer shape this models and why>"
labels:
  customer: <A|B|...|none>          # optional, free-form

cluster:
  provider: kind                     # kind | k3d
  k8s_version: v1.30.0
  # config: chart-test/fixtures/kind-...yaml
  preinstall:
    # Helm chart preinstall (kind: helm is the default when omitted):
    # - chart: jetstack/cert-manager
    #   version: v1.14.0
    #   release: cert-manager
    #   namespace: cert-manager
    #   repo: { name: jetstack, url: "https://charts.jetstack.io" }
    #   values: { installCRDs: true }
    #   wait: pods-ready

    # Raw manifest preinstall:
    # - kind: raw_manifest
    #   path: chart-test/fixtures/gateway-api/crds.yaml     # file path (relative to project root)
    #   # namespace: default                                 # optional namespace

product:
  chart: ./chart
  release: <release-name>
  namespace: <namespace>
  # values: chart-test/fixtures/<customer>-values.yaml
  # set:
  #   image.tag: "v1.2.3"

asserts:
  - { type: helm-status-deployed, release: <release-name>, namespace: <namespace> }
  - { type: pods-ready,           namespace: <namespace>, timeout: 5m }
  # - { type: service-reachable,  service: <svc>.<ns>, port: 8080, path: /healthz }
  # - { type: smoke-script,       path: chart-test/assertions/<your-smoke>.sh }

tags:        [nightly, customer-replica]
mechanisms:  [addon:<...>, customer:<...>]
