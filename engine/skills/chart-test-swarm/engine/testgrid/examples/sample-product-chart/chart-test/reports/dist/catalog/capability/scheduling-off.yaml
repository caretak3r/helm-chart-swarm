---
id: scheduling-off
name: "Capability: no scheduling fields when unset (OFF)"
description: >-
  Renders the product chart with default values (no nodeSelector,
  tolerations, affinity, or topologySpreadConstraints overrides) and
  asserts that no workload pod spec carries any of these scheduling
  fields. Since the chart has no scheduling templates and no values are
  set, none should appear. This scenario is EXPECTED to PASS —
  confirming no scheduling fields leak onto pod specs when unset.
labels: {customer: enterprise, profile: compliance}
cluster:
  provider: kind
  k8s_version: v1.30.0
product:
  chart: ./chart
  release: sample
  namespace: sample
asserts:
  - type: scheduling-present
    namespace: sample
    source: rendered
    expect_present: false
    check_nodeSelector: true
    check_tolerations: true
    check_affinity: true
    check_topologySpreadConstraints: true
tags: [capability, compliance]
category: capability
capability: scheduling-off
tier: capability
mechanisms: ["capability:scheduling"]
