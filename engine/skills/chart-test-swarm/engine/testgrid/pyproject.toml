[project]
name = "testgrid"
version = "0.1.0"
description = "Static HTML dashboard generator for chart-test-swarm scenario runs."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
]

[project.scripts]
testgrid = "testgrid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testgrid"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
