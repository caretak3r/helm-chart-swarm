# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, kubeval, yamllint.
# Apply to your own GKE cluster per the GKE primer instructions.
---
id: cloud-native-gke-regional-networking
name: "GKE Regional Cluster Networking"
description: "Pod anti-affinity spreads replicas across zones in a regional GKE cluster; smoke-script verifies multi-zone scheduling and inter-zone Service reachability."
labels:
  customer: any
  profile: gke
  chart-test-swarm/target-k8s-version: gke-1.30
cluster:
  provider: gke
  k8s_version: "1.30"
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    replicaCount: "3"
    podAntiAffinity.enabled: "true"
    podAntiAffinity.topologyKey: "topology.kubernetes.io/zone"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/cloud-native/gke/regional-networking.sh
tags: [cloud-native]
mechanisms: ['cloud:gke', 'addon:regional-networking']
category: cloud-native
tier: authored-only
integration: gke-regional-networking
