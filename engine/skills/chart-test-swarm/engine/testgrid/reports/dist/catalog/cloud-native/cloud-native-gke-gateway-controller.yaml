# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, kubeval, yamllint.
# Apply to your own GKE cluster per the GKE primer instructions.
---
id: cloud-native-gke-gateway-controller
name: "GKE Gateway Controller"
description: "Gateway + HTTPRoute provisioned through the GKE managed Gateway Controller (gke-l7-global-external-managed)."
labels:
  customer: any
  profile: gke
  chart-test-swarm/target-k8s-version: gke-1.30
cluster:
  provider: gke
  k8s_version: "1.30"
  preinstall:
    - kind: raw_manifest
      path: chart-test/fixtures/cloud-native/gke/gateway-httproute.yaml
      namespace: sample
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    gke.gatewayController.enabled: "true"
    gke.gatewayController.gatewayClassName: "gke-l7-global-external-managed"
    gatewayRoute.enabled: "true"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/cloud-native/gke/gateway-controller.sh
tags: [cloud-native]
mechanisms: ['cloud:gke', 'addon:gateway-controller']
category: cloud-native
tier: authored-only
integration: gke-gateway-controller
