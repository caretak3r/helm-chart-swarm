# Copy into your chart repo at .github/workflows/chart-test-nightly.yml
# Runs the full nightly suite against main every night, uploads dashboard.
name: chart-test-swarm (nightly)

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:

jobs:
  swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ENGINE_REPO: yourorg/chart-test-swarm
      ENGINE_REF:  v0.1.0
    steps:
      - name: Checkout consumer chart
        uses: actions/checkout@v4
        with:
          ref: main
          path: consumer

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref:        ${{ env.ENGINE_REF  }}
          path: engine

      - name: Install kind + yq + jq + helm
        run: |
          curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64 && chmod +x /usr/local/bin/kind
          curl -L  https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - uses: astral-sh/setup-uv@v3

      - name: Preflight
        working-directory: engine
        run: make verify

      - name: Run swarm (nightly-full)
        working-directory: engine
        env:
          PROJECT:    ${{ github.workspace }}/consumer
          SUITE:      nightly-full
          NUM_AGENTS: 4
        run: |
          RUN_ID="run-$(date +%Y%m%d-%H%M%S)"
          bash engine/scripts/dispatch-swarm.sh "$PROJECT" "$SUITE" "$NUM_AGENTS" "$RUN_ID"
          for f in $(find consumer/chart-test/scenarios -type f \( -name '*.yaml' -o -name '*.yml' \)); do
            tags=$(yq -o=json '.tags // []' "$f")
            if echo "$tags" | jq -e 'index("nightly")' >/dev/null; then
              bash engine/scripts/run-scenario.sh "$f" || true
            fi
          done
          bash engine/scripts/aggregate.sh "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Publish dashboard to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  engine/engine/testgrid/dist
          keep_files:   true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-test-swarm-${{ env.RUN_ID }}
          path: engine/reports/${{ env.RUN_ID }}
