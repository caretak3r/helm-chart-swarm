{{- if .Values.gatewayRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sample-product.labels" . | nindent 4 }}
    {{- include "sample-product.selectorLabels" . | nindent 4 }}
    {{- include "sample-product.extraLabels" . | nindent 4 }}
  annotations:
    {{- include "sample-product.extraAnnotations" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayRoute.parentRef.name }}
      {{- if .Values.gatewayRoute.parentRef.namespace }}
      namespace: {{ .Values.gatewayRoute.parentRef.namespace }}
      {{- end }}
      {{- if .Values.gatewayRoute.parentRef.sectionName }}
      sectionName: {{ .Values.gatewayRoute.parentRef.sectionName }}
      {{- end }}
  {{- if .Values.gatewayRoute.hostname }}
  hostnames:
    - {{ .Values.gatewayRoute.hostname | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
{{- end }}
