{{- if and .Values.serviceAccount.create .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sample-product.serviceAccountName" . }}
  labels:
    {{- include "sample-product.labels" . | nindent 4 }}
    {{- include "sample-product.selectorLabels" . | nindent 4 }}
    {{- include "sample-product.extraLabels" . | nindent 4 }}
  annotations:
    {{- include "sample-product.extraAnnotations" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
{{- end }}
