apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sample-product.labels" . | nindent 4 }}
    {{- include "sample-product.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: skywatcher
    {{- include "sample-product.extraLabels" . | nindent 4 }}
  annotations:
    {{- include "sample-product.extraAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sample-product.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sample-product.skywatcherPodLabels" . | nindent 8 }}
      annotations:
        {{- include "sample-product.meshAnnotations" . | nindent 8 }}
        {{- include "sample-product.extraAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "sample-product.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.tls.enabled }}
      {{- $mountPath := .Values.tls.mountPath | default "/etc/tls" }}
      {{- $volumeType := .Values.tls.volumeType | default "secret" }}
      {{- if ne (.Values.tls.waitForCerts | toString) "false" }}
      initContainers:
        - name: wait-for-tls
          image: {{ .Values.tls.initContainerImage | default "busybox:1.36" | quote }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for TLS certs to appear at {{ $mountPath }}..."
              until [ -f {{ $mountPath }}/tls.crt ] && [ -f {{ $mountPath }}/tls.key ]; do
                sleep 3
              done
              echo "TLS certs found, proceeding."
          volumeMounts:
            - name: tls
              mountPath: {{ $mountPath }}
      {{- end }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            {{- if ne .Values.scheme "https-only" }}
            - containerPort: {{ .Values.service.containerPort | default 80 }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - containerPort: {{ .Values.tls.servicePort }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.tls.enabled }}
          {{- $mountPath := .Values.tls.mountPath | default "/etc/tls" }}
          volumeMounts:
            - name: tls
              mountPath: {{ $mountPath }}
              readOnly: true
            - name: nginx-tls-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.service.containerPort | default 80 }} }
          livenessProbe:
            httpGet: { path: /, port: {{ .Values.service.containerPort | default 80 }} }
      {{- if .Values.tls.enabled }}
      {{- $mountPath := .Values.tls.mountPath | default "/etc/tls" }}
      {{- $volumeType := .Values.tls.volumeType | default "secret" }}
      volumes:
        {{- if eq $volumeType "persistentVolumeClaim" }}
        - name: tls
          persistentVolumeClaim:
            claimName: {{ required "tls.pvcClaimName is required when volumeType is persistentVolumeClaim" .Values.tls.pvcClaimName }}
        {{- else if eq $volumeType "projected" }}
        - name: tls
          projected:
            sources:
              - secret:
                  name: {{ .Values.tls.secretName }}
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
        {{- else if eq $volumeType "csi" }}
        - name: tls
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "tls.secretProviderClass is required when volumeType is csi" .Values.tls.secretProviderClass }}
        {{- else }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            optional: true
        {{- end }}
        - name: nginx-tls-config
          configMap:
            name: {{ .Release.Name }}-nginx-tls
      {{- end }}
