apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sample-tls
  namespace: sample
spec:
  secretName: sample-tls
  duration: 24h
  renewBefore: 12h
  issuerRef:
    name: chart-test-swarm-selfsigned
    kind: ClusterIssuer
  commonName: "sample.test.local"
  dnsNames:
    - "sample.test.local"
