# Placeholder-only fixture for AWS EBS CSI scenarios.
# Replace <REPLACE_WITH_*> values before applying to your own EKS cluster.
# No real AWS account IDs, ARNs, or access keys are stored here.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"
  # kmsKeyId: "<REPLACE_WITH_KMS_KEY_ARN>"
allowVolumeExpansion: true
