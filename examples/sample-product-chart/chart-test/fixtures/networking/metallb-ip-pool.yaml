---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: chart-test-pool
  namespace: metallb
spec:
  addresses:
    - "172.18.255.200-172.18.255.250"
    # NOTE: The kind Docker bridge subnet varies by platform and Docker config.
    # The smoke-script dynamically detects the actual subnet and patches this
    # pool if needed. Common subnets: 172.18.0.0/16, 172.19.0.0/16, 172.20.0.0/16.
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: chart-test-l2
  namespace: metallb
spec:
  ipAddressPools:
    - chart-test-pool
