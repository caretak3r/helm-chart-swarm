---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sample-gw
  namespace: sample
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: sample-grpc-route
  namespace: sample
spec:
  parentRefs:
    - name: sample-gw
      sectionName: http
  hostnames:
    - "grpc-backend.sample.svc.cluster.local"
  rules:
    - backendRefs:
        - name: grpc-backend
          port: 9000
