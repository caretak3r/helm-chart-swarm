---
apiVersion: v1
kind: Namespace
metadata:
  name: sample
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-tls-cert
  namespace: sample
type: kubernetes.io/tls
data:
  tls.crt: REPLACE_AT_RUNTIME
  tls.key: REPLACE_AT_RUNTIME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-ca-cert
  namespace: sample
data:
  ca.crt: REPLACE_AT_RUNTIME
