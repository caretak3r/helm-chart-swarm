---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mounted-tls-csi
spec:
  provider: fake
  parameters:
    objects: |
      - objectName: tls-crt
        objectType: secret
      - objectName: tls-key
        objectType: secret
  secretObjects:
    - secretName: mounted-tls-csi-secret
      type: kubernetes.io/tls
      data:
        - objectName: tls-crt
          key: tls.crt
        - objectName: tls-key
          key: tls.key
