# EKS IRSA: Kubernetes ServiceAccount with IAM role annotation.
# Requires an IAM role with OIDC trust policy configured.
# chart-test-swarm/target-k8s-version: eks-1.30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chart-test-swarm-eks-sa
  namespace: <REPLACE_WITH_NAMESPACE>
  annotations:
    eks.amazonaws.com/role-arn: "<REPLACE_WITH_IAM_ROLE_ARN>"
