    - type: helm-status-deployed
      release: sample
      namespace: sample
    - type: pods-ready
      namespace: istio-system
      selector: app=istiod
      timeout: 5m
    - type: pods-ready
      namespace: sample
      timeout: 5m
    - type: smoke-script
