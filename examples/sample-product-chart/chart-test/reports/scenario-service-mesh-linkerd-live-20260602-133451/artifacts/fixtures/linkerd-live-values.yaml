---
# Linkerd control-plane values for live scenario.
# The trust anchor PEM is a public cert (safe to commit).
# The issuer Secret is pre-created via raw_manifest (linkerd-identity-secret.yaml),
# so no crtPEM/keyPEM are needed in these values — the chart will find the
# existing Secret and use it.
proxy:
  resources:
    cpu:
      limit: "250m"
      request: "100m"
    memory:
      limit: "256Mi"
      request: "64Mi"
identity:
  issuer:
    scheme: linkerd.io/tls
identityTrustAnchorsPEM: |
