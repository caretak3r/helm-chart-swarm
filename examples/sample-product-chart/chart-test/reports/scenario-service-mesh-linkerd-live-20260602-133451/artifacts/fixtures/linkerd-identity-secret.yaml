---
# Linkerd namespace and identity issuer Secret.
# Test-only ephemeral ECDSA P-256 certs for chart-test-swarm kind clusters.
# NOT real production credentials — safe to commit for reproducibility.
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
---
apiVersion: v1
kind: Secret
metadata:
  name: linkerd-identity-issuer-secrets
  namespace: linkerd
type: kubernetes.io/tls
data:
  ca.crt:   # yamllint disable-line rule:line-length
  tls.crt:   # yamllint disable-line rule:line-length
  tls.key:   # yamllint disable-line rule:line-length
