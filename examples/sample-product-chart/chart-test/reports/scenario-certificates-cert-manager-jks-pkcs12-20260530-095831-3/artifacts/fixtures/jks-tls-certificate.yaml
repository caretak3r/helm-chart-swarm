apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sample-jks-tls
  namespace: sample
spec:
  secretName: sample-jks-tls
  duration: 24h
  renewBefore: 12h
  issuerRef:
    name: chart-test-swarm-selfsigned
    kind: ClusterIssuer
  commonName: "sample.sample.svc"
  dnsNames:
    - "sample.sample.svc"
