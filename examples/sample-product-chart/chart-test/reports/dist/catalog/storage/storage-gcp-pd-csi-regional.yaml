# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, yamllint.
# Apply to your own GKE cluster per the gcp-pd-csi primer instructions.
---
id: storage-gcp-pd-csi-regional
name: "GCP PD CSI Regional PD"
description: >-
  GCE PD CSI Driver provisions a regional Persistent Disk from a PVC using a
  StorageClass with replication-type: regional-pd. The volume is accessible
  from nodes in multiple zones within the region, providing cross-zone
  redundancy.
labels:
  customer: any
  profile: gke
  chart-test-swarm/target-k8s-version: gke-1.30
cluster:
  provider: gke
  k8s_version: "1.30"
  preinstall:
    - kind: raw_manifest
      path: chart-test/fixtures/storage/gcp-pd-csi/storageclass-regional.yaml
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    darkroom.enabled: "true"
    darkroom.persistence.enabled: "true"
    darkroom.persistence.storageClassName: "pd-regional-ssd"
    darkroom.persistence.accessMode: "ReadWriteOnce"
    darkroom.persistence.size: "10Gi"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/storage/gcp-pd-csi/regional-pd.sh
tags: [cloud-native, storage]
mechanisms: ['cloud:gke', 'addon:gcp-pd-csi', 'feature:regional-pd']
category: storage/csi
tier: authored-only
integration: gcp-pd-csi
