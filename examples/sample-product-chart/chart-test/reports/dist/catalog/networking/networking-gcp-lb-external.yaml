# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, kubeval, yamllint.
# Apply to your own GKE cluster per the gcp-lb primer instructions.
---
id: networking-gcp-lb-external
name: "GCP LB External HTTP(S)"
description: >-
  GKE provisions an external HTTP(S) load balancer from a Kubernetes Ingress
  with a Google-managed certificate; smoke-script curls the external IP over
  HTTPS.
labels:
  customer: any
  profile: gke
  chart-test-swarm/target-k8s-version: gke-1.30
cluster:
  provider: gke
  k8s_version: "1.30"
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    ingress.enabled: "true"
    ingress.className: "gce"
    ingress.annotations.networking.gke.io/managed-certificates: "<REPLACE_WITH_CERT_NAME>"
    ingress.annotations.kubernetes.io/ingress.global-static-ip-name: "<REPLACE_WITH_STATIC_IP_NAME>"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/cloud-native/gke/external-lb.sh
tags: [cloud-native]
mechanisms: ['cloud:gke', 'addon:gcp-lb', 'addon:external-lb']
category: networking/ingress-lb
tier: authored-only
integration: gcp-lb
