---
id: gateway-api-istio-gateway-api-backend-tls-policy
name: "Istio Gateway API BackendTLSPolicy"
description: "Installs istio/base + istio/istiod and Gateway API CRDs, enables TLS on the product backend, creates BackendTLSPolicy targeting the Service, and verifies gateway-to-backend TLS."
labels: {customer: any, profile: gateway-api-backendtls}
cluster:
  provider: kind
  k8s_version: v1.30.0
  preinstall:
    - kind: helm
      chart: istio/base
      version: 1.27.9
      release: istio-base
      namespace: istio-system
      repo:
        name: istio
        url: "https://istio-release.storage.googleapis.com/charts"
      values: {}
      wait: helm-deployed
      wait_timeout: 2m
    - kind: helm
      chart: istio/istiod
      version: 1.27.9
      release: istiod
      namespace: istio-system
      repo:
        name: istio
        url: "https://istio-release.storage.googleapis.com/charts"
      values:
        pilot:
          env:
            PILOT_ENABLE_ALPHA_GATEWAY_API: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
      wait: pods-ready
      wait_timeout: 5m
    - kind: raw_manifest
      path: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
    - kind: raw_manifest
      path: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/experimental-install.yaml
    - kind: raw_manifest
      path: ./fixtures/istio-gateway-api-backend-tls-secret.yaml
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    image.repository: "nginx"
    image.tag: "1.27-alpine"
    tls.enabled: "true"
    tls.secretName: "backend-tls-cert"
    tls.servicePort: "443"
    tls.waitForCerts: "false"
    gatewayRoute.enabled: "true"
    gatewayRoute.parentRef.name: "sample-gw"
    gatewayRoute.parentRef.sectionName: "http"
asserts:
  - type: helm-status-deployed
    release: istio-base
    namespace: istio-system
  - type: helm-status-deployed
    release: istiod
    namespace: istio-system
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: istio-system
    selector: app=istiod
    timeout: 5m
  - type: pods-ready
    namespace: sample
    timeout: 5m
  - type: smoke-script
    path: chart-test/assertions/istio-gateway-api-backend-tls-policy.sh
tags: [nightly]
mechanisms: ['addon:istio', 'gateway-api:istio']
