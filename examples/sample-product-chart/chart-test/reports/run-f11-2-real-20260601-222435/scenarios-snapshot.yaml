scenarios:
- id: minimal
  name: "Vanilla cluster — no preinstalled addons"
  description: "Baseline: chart installs and pods come up on a stock kind cluster."
  labels:
    customer: none
    profile: baseline
  cluster:
    provider: kind
    k8s_version: v1.30.0
  product:
    chart: ./chart
    release: sample
    namespace: sample
  asserts:
    - {type: helm-status-deployed, release: sample, namespace: sample}
    - {type: pods-ready, namespace: sample, timeout: 3m}
  tags: [pr-subset, nightly]
  mechanisms: ['addon:none']
- id: subchart-postgres-internal
  name: "Internal postgres subchart enabled"
  description: "Product chart bundles postgres via subchart; verify both come up together."
  labels:
    profile: full-stack
  cluster:
    provider: kind
    k8s_version: v1.30.0
  product:
    chart: ./chart
    release: sample
    namespace: sample
    set:
      postgres.enabled: "true"
    subcharts:
      postgres: internal
  asserts:
    - {type: helm-status-deployed, release: sample, namespace: sample}
    - {type: pods-ready, namespace: sample, timeout: 4m}
  tags: [pr-subset, nightly]
  mechanisms: ['subchart:postgres-internal']
