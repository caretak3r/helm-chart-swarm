---
apiVersion: batch/v1
kind: Job
metadata:
  name: populate-mounted-tls-pvc
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: populate
          image: busybox:1.36
          env:
            - name: TLS_CRT_B64
              value: ""
            - name: TLS_KEY_B64
              value: ""
          command:
            - sh
            - -c
            - |
              echo "" | base64 -d > /certs/tls.crt
              echo "" | base64 -d > /certs/tls.key
              chmod 644 /certs/tls.crt /certs/tls.key
              echo "TLS certs written to PVC"
              ls -la /certs/
              [ -f /certs/tls.crt ] && [ -f /certs/tls.key ] && echo OK || { echo "FAIL: missing cert files"; exit 1; }
          volumeMounts:
            - name: certs
              mountPath: /certs
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: mounted-tls-pvc
