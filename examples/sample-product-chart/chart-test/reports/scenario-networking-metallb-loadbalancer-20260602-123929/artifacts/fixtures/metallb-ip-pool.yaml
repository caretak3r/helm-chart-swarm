---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: chart-test-pool
  namespace: metallb
spec:
  addresses:
    - "172.18.255.200-172.18.255.250"
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: chart-test-l2
  namespace: metallb
spec:
  ipAddressPools:
    - chart-test-pool
