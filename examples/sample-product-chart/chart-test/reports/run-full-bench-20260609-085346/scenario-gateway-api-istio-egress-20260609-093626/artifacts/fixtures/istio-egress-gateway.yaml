---
# Istio Gateway: configures the egress gateway proxy to listen for httpbin.org
# Applied in the istio-system namespace alongside the egress gateway deployment.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: egressgateway
  namespace: istio-system
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - httpbin.org
