scenarios:
- id: minimal
  name: "Vanilla cluster — no preinstalled addons"
  description: "Baseline: chart installs and pods come up on a stock kind cluster."
  labels:
    customer: none
    profile: baseline
  cluster:
    provider: kind
    k8s_version: v1.30.0
  product:
    chart: ./chart
    release: sample
    namespace: sample
  asserts:
    - {type: helm-status-deployed, release: sample, namespace: sample}
    - {type: pods-ready, namespace: sample, timeout: 3m}
  tags: [pr-subset, nightly]
  mechanisms: ['addon:none']
- id: certificates-cert-manager-jks-pkcs12
  name: "cert-manager JKS/PKCS12 keystore bundle"
  description: "Installs cert-manager with a self-signed ClusterIssuer, issues a Certificate, wraps tls.crt+tls.key into a PKCS12 bundle, and stores as a new Secret alongside the TLS material."
  labels:
    customer: any
    profile: tls
  cluster:
    provider: kind
    k8s_version: v1.30.0
    preinstall:
      - kind: helm
        chart: jetstack/cert-manager
        version: v1.14.0
        release: cert-manager
        namespace: cert-manager
        repo:
          name: jetstack
          url: "https://charts.jetstack.io"
        values:
          installCRDs: true
        wait: pods-ready
        wait_timeout: 3m
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/selfsigned-clusterissuer.yaml
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/jks-tls-certificate.yaml
        namespace: sample
  product:
    chart: ./chart
    release: sample
    namespace: sample
    set:
      tls.enabled: "false"
  asserts:
    - type: helm-status-deployed
      release: sample
      namespace: sample
    - type: pods-ready
      namespace: sample
      timeout: 3m
    - type: smoke-script
      path: chart-test/assertions/cert-manager-jks-pkcs12.sh
  tags: [nightly]
  mechanisms: ['addon:cert-manager']
- id: certificates-cert-manager-lets-encrypt-staging
  name: "cert-manager Let's Encrypt staging issuer"
  description: "Installs cert-manager with Let's Encrypt staging ACME issuer. Verifies ClusterIssuer Ready=True and uses self-signed fallback Certificate to confirm chart pods serve TLS."
  labels:
    customer: any
    profile: tls
  cluster:
    provider: kind
    k8s_version: v1.30.0
    preinstall:
      - kind: helm
        chart: jetstack/cert-manager
        version: v1.14.0
        release: cert-manager
        namespace: cert-manager
        repo:
          name: jetstack
          url: "https://charts.jetstack.io"
        values:
          installCRDs: true
        wait: pods-ready
        wait_timeout: 3m
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/selfsigned-clusterissuer.yaml
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/letsencrypt-staging-clusterissuer.yaml
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/sample-tls-certificate.yaml
        namespace: sample
  product:
    chart: ./chart
    release: sample
    namespace: sample
    set:
      tls.enabled: "true"
      tls.secretName: sample-tls
      tls.servicePort: "443"
  asserts:
    - type: helm-status-deployed
      release: sample
      namespace: sample
    - type: pods-ready
      namespace: sample
      timeout: 5m
    - type: smoke-script
      path: chart-test/assertions/cert-manager-letsencrypt-staging.sh
  tags: [nightly]
  mechanisms: ['addon:cert-manager']
- id: certificates-cert-manager-self-signed-ca
  name: "cert-manager self-signed CA issuer"
  description: "Installs cert-manager, creates a self-signed ClusterIssuer, issues a Certificate for the product Service FQDN, and verifies HTTPS serving with --cacert."
  labels:
    customer: any
    profile: tls
  cluster:
    provider: kind
    k8s_version: v1.30.0
    preinstall:
      - kind: helm
        chart: jetstack/cert-manager
        version: v1.14.0
        release: cert-manager
        namespace: cert-manager
        repo:
          name: jetstack
          url: "https://charts.jetstack.io"
        values:
          installCRDs: true
        wait: pods-ready
        wait_timeout: 3m
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/selfsigned-clusterissuer.yaml
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/sample-tls-certificate.yaml
        namespace: sample
  product:
    chart: ./chart
    release: sample
    namespace: sample
    set:
      tls.enabled: "true"
      tls.secretName: sample-tls
      tls.servicePort: "443"
  asserts:
    - type: helm-status-deployed
      release: sample
      namespace: sample
    - type: pods-ready
      namespace: sample
      timeout: 5m
    - type: smoke-script
      path: chart-test/assertions/cert-manager-self-signed.sh
  tags: [nightly]
  mechanisms: ['addon:cert-manager']
- id: certificates-cert-manager-wildcard
  name: "cert-manager wildcard certificate"
  description: "Installs cert-manager with a self-signed ClusterIssuer, issues a wildcard Certificate with SAN DNS:*.test.local + test.local, and verifies both SANs are present."
  labels:
    customer: any
    profile: tls
  cluster:
    provider: kind
    k8s_version: v1.30.0
    preinstall:
      - kind: helm
        chart: jetstack/cert-manager
        version: v1.14.0
        release: cert-manager
        namespace: cert-manager
        repo:
          name: jetstack
          url: "https://charts.jetstack.io"
        values:
          installCRDs: true
        wait: pods-ready
        wait_timeout: 3m
