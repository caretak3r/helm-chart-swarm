        path: chart-test/fixtures/certificates/selfsigned-clusterissuer.yaml
      - kind: raw_manifest
        path: chart-test/fixtures/certificates/wildcard-tls-certificate.yaml
        namespace: sample
  product:
    chart: ./chart
    release: sample
    namespace: sample
    set:
      tls.enabled: "false"
  asserts:
    - type: helm-status-deployed
      release: sample
      namespace: sample
    - type: pods-ready
      namespace: sample
      timeout: 3m
    - type: smoke-script
      path: chart-test/assertions/cert-manager-wildcard.sh
  tags: [nightly]
  mechanisms: ['addon:cert-manager']
