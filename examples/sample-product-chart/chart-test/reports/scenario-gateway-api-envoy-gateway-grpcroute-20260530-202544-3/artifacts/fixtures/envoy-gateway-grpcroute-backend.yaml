---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-backend
  namespace: sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-backend
  template:
    metadata:
      labels:
        app: grpc-backend
    spec:
      containers:
        - name: grpc-server
          image: docker.io/moul/grpcbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: grpc
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-backend
  namespace: sample
spec:
  selector:
    app: grpc-backend
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP
