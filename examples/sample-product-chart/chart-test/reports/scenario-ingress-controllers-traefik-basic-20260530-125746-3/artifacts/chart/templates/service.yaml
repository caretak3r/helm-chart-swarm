apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sample-product.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      name: http
    {{- if .Values.tls.enabled }}
    - port: {{ .Values.tls.servicePort }}
      targetPort: {{ .Values.tls.servicePort }}
      name: https
    {{- end }}
