---
id: annotations-on
name: "Capability: custom annotations stamped on every object (ON)"
description: >-
  Renders the product chart with a global annotation knob set
  (extraAnnotations.example\.com/owner=team-x) and asserts every rendered
  object (all kinds) carries the configured annotation at
  .metadata.annotations. The sample chart does NOT expose an
  extraAnnotations/commonAnnotations knob — this scenario is EXPECTED to FAIL
  (honest red gap) documenting that the chart lacks global annotation
  propagation.
labels: {customer: enterprise, profile: compliance}
cluster:
  provider: kind
  k8s_version: v1.36.1
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    ingress.enabled: true
    "extraAnnotations.example\\.com/owner": team-x
asserts:
  - type: annotations-present
    namespace: sample
    source: rendered
    annotations:
      example.com/owner: team-x
tags: [capability, compliance, curated-live]
category: capability
capability: annotate-all-objects
tier: capability
mechanisms: ["capability:annotations"]
