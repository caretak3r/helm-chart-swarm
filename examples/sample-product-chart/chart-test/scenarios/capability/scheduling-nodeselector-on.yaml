---
id: scheduling-nodeselector-on
name: "Capability: nodeSelector settable on ALL workloads (ON)"
description: >-
  Renders the product chart with nodeSelector.kubernetes.io/os=linux configured
  and asserts that every workload pod spec carries nodeSelector with the
  configured value, proving the chart's nodeSelector knob works end-to-end
  on a real kind cluster.
labels: {customer: enterprise, profile: compliance}
cluster:
  provider: kind
  k8s_version: v1.36.1
product:
  chart: ./chart
  release: sample
  namespace: sample
  values: chart-test/fixtures/capability/scheduling-nodeselector-values.yaml
asserts:
  - type: scheduling-present
    namespace: sample
    source: rendered
    expect_present: true
    check_nodeSelector: true
    check_tolerations: false
    check_affinity: false
    check_topologySpreadConstraints: false
    nodeSelector:
      kubernetes.io/os: linux
tags: [capability, compliance]
category: capability
capability: node-selector
tier: capability
mechanisms: ["capability:scheduling"]
