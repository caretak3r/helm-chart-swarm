---
id: certificates-cert-manager-lets-encrypt-staging
name: "cert-manager Let's Encrypt staging issuer"
description: "Installs cert-manager with Let's Encrypt staging ACME issuer. Verifies ClusterIssuer Ready=True and uses self-signed fallback Certificate to confirm chart pods serve TLS."
labels: {customer: any, profile: tls}
cluster:
  provider: kind
  k8s_version: v1.36.1
  preinstall:
    - kind: helm
      chart: jetstack/cert-manager
      version: v1.14.0
      release: cert-manager
      namespace: cert-manager
      repo:
        name: jetstack
        url: "https://charts.jetstack.io"
      values:
        installCRDs: true
      wait: pods-ready
      wait_timeout: 3m
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/selfsigned-clusterissuer.yaml
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/letsencrypt-staging-clusterissuer.yaml
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/sample-tls-certificate.yaml
      namespace: sample
  helm_timeout: 10m
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    tls.enabled: "true"
    tls.secretName: sample-tls
    tls.servicePort: "443"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
    timeout: 5m
  - type: smoke-script
    path: chart-test/assertions/cert-manager-letsencrypt-staging.sh
tags: [nightly]
mechanisms: ['addon:cert-manager']
category: certificates
integration: cert-manager
tier: live
