---
id: certificates-cert-manager-self-signed-ca
name: "cert-manager self-signed CA issuer"
description: "Installs cert-manager, creates a self-signed ClusterIssuer, issues a Certificate for the product Service FQDN, and verifies HTTPS serving with --cacert."
labels: {customer: any, profile: tls}
cluster:
  provider: kind
  k8s_version: v1.30.0
  preinstall:
    - kind: helm
      chart: jetstack/cert-manager
      version: v1.14.0
      release: cert-manager
      namespace: cert-manager
      repo:
        name: jetstack
        url: "https://charts.jetstack.io"
      values:
        installCRDs: true
      wait: pods-ready
      wait_timeout: 3m
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/selfsigned-clusterissuer.yaml
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/sample-tls-certificate.yaml
      namespace: sample
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    tls.enabled: "true"
    tls.secretName: sample-tls
    tls.servicePort: "443"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
    timeout: 5m
  - type: smoke-script
    path: chart-test/assertions/cert-manager-self-signed.sh
  - type: tls-cert-valid
    namespace: sample
    tls_secret: "sample-tls"
    tls_host: "sample.sample.svc"
    port: 443
    expected_status: 200
tags: [nightly]
mechanisms: ['addon:cert-manager']
category: certificates
integration: cert-manager
tier: live
