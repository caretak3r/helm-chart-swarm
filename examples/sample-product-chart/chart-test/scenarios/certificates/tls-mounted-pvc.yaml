---
id: tls-mounted-pvc
name: "TLS via persistentVolumeClaim"
description: >-
  Creates a PVC, populates it with TLS certs via a Job, then deploys the chart
  with tls.volumeType=persistentVolumeClaim and tls.pvcClaimName pointing at
  the pre-populated PVC. Verifies the pod mount, cert files at mountPath,
  and in-cluster HTTPS curl returns 200. Artifact bundle records the exact
  volumeType=persistentVolumeClaim.
labels: {customer: any, profile: tls}
cluster:
  provider: kind
  k8s_version: v1.30.0
  preinstall:
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/mounted-tls/mounted-tls-pvc.yaml
      namespace: sample
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/mounted-tls/mounted-tls-pvc-certs-configmap.yaml
      namespace: sample
    - kind: raw_manifest
      path: chart-test/fixtures/certificates/mounted-tls/mounted-tls-populate-job.yaml
      namespace: sample
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    tls.enabled: "true"
    tls.secretName: "unused-for-pvc"
    tls.servicePort: "443"
    tls.volumeType: "persistentVolumeClaim"
    tls.pvcClaimName: "mounted-tls-pvc"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
    selector: app=sample
    timeout: 10m
  - type: smoke-script
    path: chart-test/assertions/mounted-tls-pvc-mount.sh
tags: [nightly]
mechanisms: ['addon:mounted-tls-certs']
category: certificates
integration: mounted-tls-certs
tier: live
