---
id: networking-traefik-ingress
name: "Traefik Ingress (className=traefik)"
description: >-
  Installs Traefik, deploys the product chart with ingress.enabled=true
  and ingress.className=traefik, and verifies end-to-end routing through
  the Traefik data path via the chart's built-in Ingress resource.
labels: {customer: any, profile: ingress}
cluster:
  provider: kind
  k8s_version: v1.30.0
  preinstall:
    - kind: helm
      chart: traefik/traefik
      version: v28.3.0
      release: traefik
      namespace: traefik
      repo:
        name: traefik
        url: "https://traefik.github.io/charts"
      values:
        image:
          registry: ghcr.io
          repository: traefik/traefik
        ingressClass:
          enabled: true
          isDefaultClass: false
        ingressRoute:
          dashboard:
            enabled: false
        ports:
          web:
            exposedPort: 80
          websecure:
            exposedPort: 443
        service:
          type: NodePort
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
      wait: pods-ready
      wait_timeout: 3m
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    image.repository: "public.ecr.aws/nginx/nginx"
    image.tag: "1.27-alpine"
    ingress.enabled: "true"
    ingress.className: "traefik"
    ingress.host: "sample.test.local"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
    timeout: 5m
  - type: pods-ready
    namespace: traefik
    timeout: 3m
  - type: smoke-script
    path: chart-test/assertions/traefik-ingress.sh
  - type: ingress-routes-traffic
    namespace: sample
    ingress_host: "sample.test.local"
    controller_namespace: "traefik"
    controller_label: "app.kubernetes.io/name=traefik"
    controller_port: 8000
tags: [nightly, curated-live]
mechanisms: ['addon:traefik']
category: networking
integration: traefik
tier: live
