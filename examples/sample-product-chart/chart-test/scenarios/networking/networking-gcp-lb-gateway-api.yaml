# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, kubeval, yamllint.
# Apply to your own GKE cluster per the gcp-lb primer instructions.
---
id: networking-gcp-lb-gateway-api
name: "GCP LB Gateway API"
description: >-
  GKE Gateway Controller provisions a Google Cloud load balancer from a
  Gateway + HTTPRoute pair; smoke-script waits for the Gateway IP and curls
  over HTTP.
labels:
  customer: any
  profile: gke
  chart-test-swarm/target-k8s-version: gke-1.30
cluster:
  provider: gke
  k8s_version: "1.30"
  preinstall:
    - kind: raw_manifest
      path: chart-test/fixtures/cloud-native/gke/gateway-httproute.yaml
      namespace: sample
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    gatewayRoute.enabled: "true"
    gatewayRoute.parentGateway.name: "chart-test-swarm-gcp-gateway"
    gatewayRoute.parentGateway.namespace: "<REPLACE_WITH_NAMESPACE>"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/cloud-native/gke/gateway-api-lb.sh
tags: [cloud-native]
mechanisms: ['cloud:gke', 'addon:gcp-lb', 'addon:gateway-api']
category: networking/ingress-lb
tier: authored-only
integration: gcp-lb
