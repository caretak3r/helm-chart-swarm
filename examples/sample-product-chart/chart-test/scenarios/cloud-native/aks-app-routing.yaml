# AUTHORED ONLY — not run from this repo.
# Validate with: kubectl --dry-run=client, kubeval, yamllint.
# Apply to your own AKS cluster per the AKS primer instructions.
---
id: cloud-native-aks-app-routing
name: "AKS App Routing Addon"
description: "Managed nginx ingress controller with Azure DNS integration; Ingress with webapprouting.kubernetes.azure.com ingress class; smoke-script resolves DNS and curls."
labels:
  customer: any
  profile: aks
  chart-test-swarm/target-k8s-version: aks-1.30
cluster:
  provider: aks
  k8s_version: "1.30"
product:
  chart: ./chart
  release: sample
  namespace: sample
  set:
    aks.appRouting.enabled: "true"
    aks.appRouting.dnsZoneResourceGroup: "<REPLACE_WITH_DNS_RG>"
    ingress.enabled: "true"
    ingress.className: "webapprouting.kubernetes.azure.com"
    ingress.hosts[0].host: "<REPLACE_WITH_HOSTNAME>"
asserts:
  - type: helm-status-deployed
    release: sample
    namespace: sample
  - type: pods-ready
    namespace: sample
  - type: smoke-script
    path: chart-test/assertions/cloud-native/aks/app-routing.sh
tags: [cloud-native]
mechanisms: [cloud:aks, addon:app-routing]
