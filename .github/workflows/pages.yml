name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - reports/dist/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages, and serialize concurrent runs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable Jekyll processing
        run: touch reports/dist/.nojekyll

      # The generated index.html is the legacy runs table (its successor lives at
      # runs.html); home.html is the real portal with full nav. GitHub Pages serves
      # index.html at the root, so promote the portal to root. See render.py render_home.
      - name: Promote portal page to site root
        run: cp reports/dist/home.html reports/dist/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
